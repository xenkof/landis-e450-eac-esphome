esphome:
  name: landis-meter
  friendly_name: Landis+Gyr E450

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# ============================================================
# REQUIRED: Fix for Cyprus E450 HDLC frame format
# Without this, all sensor values will read as zero.
# Remove this block once PR #16942 is merged into ESPHome:
# https://github.com/esphome/esphome/pull/16942
# ============================================================
external_components:
  - source: github://pr#16942
    components: [dlms_meter]
    refresh: 1s

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

api:
  encryption:
    key: !secret landis_api_encryption_key

ota:
  - platform: esphome

# ============================================================
# M-Bus UART Configuration
# Confirmed working for EAC Cyprus Landis+Gyr E450:
#   - Baud rate: 2400
#   - Parity: NONE
#   - Data bits: 8
#   - Stop bits: 1
#
# Physical wiring (M-Bus module → ESP32-C6 SuperMini):
#   VCC → 5V
#   GND → GND
#   TXD → GPIO17  (note: TX/RX swapped vs standard convention)
#   RXD → GPIO16
#
# If you get no data at all, swap GPIO16 and GPIO17.
# M-Bus terminals on the module are polarity-insensitive.
# ============================================================
uart:
  id: mbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 2400
  rx_buffer_size: 2048
  data_bits: 8
  parity: NONE
  stop_bits: 1

# ============================================================
# receive_timeout increased to 1500ms to prevent spurious
# timeout warnings in the log at each minute boundary when
# the larger 1057-byte billing frame arrives.
# ============================================================
dlms_meter:
  uart_id: mbus_uart
  receive_timeout: 1500ms

# ============================================================
# The meter broadcasts three frame types:
#
# Frame 1 (every 5 seconds) — instantaneous values:
#   power, voltage, current, frequency, power factor,
#   reactive power, disconnect status, timestamp
#   Frame size: ~600 bytes
#
# Frame 2 (every ~10 seconds) — billing/tariff totals:
#   energy totals (overall and per tariff rate),
#   reactive energy totals, device ID, serial number,
#   active tariff name, breaker status
#   Frame size: ~600 bytes
#
# Frame 3 (every minute) — historical/multi-tariff stream:
#   Large 1057-byte burst at minute boundaries containing
#   full billing dataset including per-tariff cumulative
#   energy import/export totals
#
# Scaling factors confirmed for EAC Cyprus Landis+Gyr E450:
#   Energy:         raw Wh    × 0.001  → kWh
#   Reactive Energy:raw VArh  × 0.001  → kVArh
#   Current:        raw mA    × 0.01   → A
#   Power Factor:   raw ×1000 × 0.001  → dimensionless
#   Reactive Power: raw mVAr  × 0.001  → VAr
#   Power / Voltage / Frequency: no scaling needed
# ============================================================

sensor:
  # ----------------------------------------------------------
  # RAW DLMS SENSORS — Frame 1 (instantaneous, every 5s)
  # Marked internal=true — not visible in Home Assistant.
  # ----------------------------------------------------------

  - platform: dlms_meter
    obis_code: "1-0:1.7.0"       # Instantaneous active power import
    id: raw_power_import
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:2.7.0"       # Instantaneous active power export
    id: raw_power_export
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:3.7.0"       # Instantaneous reactive power import
    id: raw_reactive_import
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:4.7.0"       # Instantaneous reactive power export
    id: raw_reactive_export
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:32.7.0"      # Voltage L1
    id: raw_voltage_l1
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:31.7.0"      # Current L1 (raw in mA)
    id: raw_current_l1
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:13.7.0"      # Power factor (raw ×1000)
    id: raw_power_factor
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:14.7.0"      # Grid frequency
    id: raw_frequency
    internal: true

  - platform: dlms_meter
    obis_code: "0-0:96.3.0.255"  # Disconnect control status (0=open, 1=closed, 2=armed)
    id: raw_disconnect_status
    internal: true

  # ----------------------------------------------------------
  # RAW DLMS SENSORS — Frame 2 (billing totals, every ~10s)
  # ----------------------------------------------------------

  - platform: dlms_meter
    obis_code: "1-0:1.8.0"       # Total energy import (raw in Wh)
    id: raw_energy_import
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:2.8.0"       # Total energy export (raw in Wh)
    id: raw_energy_export
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:3.8.0"       # Total reactive energy import (raw in VArh)
    id: raw_reactive_energy_import
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:4.8.0"       # Total reactive energy export (raw in VArh)
    id: raw_reactive_energy_export
    internal: true

  - platform: dlms_meter
    obis_code: "0-0:96.3.10.255" # Breaker status (0=open, 1=closed/normal, 2=armed)
    id: raw_breaker_status
    internal: true

  # ----------------------------------------------------------
  # RAW DLMS SENSORS — Frame 3 (historical/multi-tariff, every minute)
  # Large 1057-byte burst at minute boundaries.
  # EAC Cyprus uses two billing tariff rates (Rate 1 and Rate 2).
  # ----------------------------------------------------------

  - platform: dlms_meter
    obis_code: "1-0:1.8.1"       # Cumulative energy import Tariff 1 (raw in Wh)
    id: raw_energy_import_rate1
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:1.8.2"       # Cumulative energy import Tariff 2 (raw in Wh)
    id: raw_energy_import_rate2
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:2.8.1"       # Cumulative energy export Tariff 1 (raw in Wh)
    id: raw_energy_export_rate1
    internal: true

  - platform: dlms_meter
    obis_code: "1-0:2.8.2"       # Cumulative energy export Tariff 2 (raw in Wh)
    id: raw_energy_export_rate2
    internal: true


  # ----------------------------------------------------------
  # CALIBRATED TEMPLATE SENSORS — visible in Home Assistant
  # ----------------------------------------------------------

  # --- Instantaneous Power ---
  - platform: template
    name: "Grid Power Import"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: return id(raw_power_import).state;

  - platform: template
    name: "Grid Power Export"
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: return id(raw_power_export).state;

  # --- Reactive Power ---
  - platform: template
    name: "Reactive Power Import"
    unit_of_measurement: VAr
    device_class: reactive_power
    state_class: measurement
    accuracy_decimals: 1
    lambda: return id(raw_reactive_import).state * 0.001;  # mVAr → VAr

  - platform: template
    name: "Reactive Power Export"
    unit_of_measurement: VAr
    device_class: reactive_power
    state_class: measurement
    accuracy_decimals: 1
    lambda: return id(raw_reactive_export).state * 0.001;  # mVAr → VAr

  # --- Phase L1 ---
  - platform: template
    name: "Voltage L1"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    lambda: return id(raw_voltage_l1).state;

  - platform: template
    name: "Current L1"
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    lambda: return id(raw_current_l1).state * 0.01;  # mA → A

  # --- Power Quality ---
  - platform: template
    name: "Power Factor"
    unit_of_measurement: ""
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 3
    lambda: return id(raw_power_factor).state * 0.001;  # ×1000 → dimensionless

  - platform: template
    name: "Frequency"
    unit_of_measurement: Hz
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    lambda: return id(raw_frequency).state;

  # --- Energy Totals (use these in HA Energy Dashboard) ---
  - platform: template
    name: "Grid Energy Import Total"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: return id(raw_energy_import).state * 0.001;   # Wh → kWh

  - platform: template
    name: "Grid Energy Export Total"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: return id(raw_energy_export).state * 0.001;   # Wh → kWh

  # --- Per-Tariff Energy Totals (from minute frame) ---
  # EAC Cyprus bills on two tariff rates.
  # These update once per minute from the large billing frame.
  - platform: template
    name: "Grid Energy Import Tariff 1"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: return id(raw_energy_import_rate1).state * 0.001;  # Wh → kWh

  - platform: template
    name: "Grid Energy Import Tariff 2"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: return id(raw_energy_import_rate2).state * 0.001;  # Wh → kWh

  - platform: template
    name: "Grid Energy Export Tariff 1"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: return id(raw_energy_export_rate1).state * 0.001;  # Wh → kWh

  - platform: template
    name: "Grid Energy Export Tariff 2"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: return id(raw_energy_export_rate2).state * 0.001;  # Wh → kWh

  # --- Reactive Energy Totals ---
  - platform: template
    name: "Reactive Energy Import Total"
    unit_of_measurement: kVArh
    device_class: reactive_energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: return id(raw_reactive_energy_import).state * 0.001;  # VArh → kVArh

  - platform: template
    name: "Reactive Energy Export Total"
    unit_of_measurement: kVArh
    device_class: reactive_energy
    state_class: total_increasing
    accuracy_decimals: 3
    lambda: return id(raw_reactive_energy_export).state * 0.001;  # VArh → kVArh


# ============================================================
# TEXT SENSORS — string values from the meter
# These arrive in the minute billing frame.
# ============================================================
text_sensor:
  - platform: dlms_meter
    obis_code: "0-0:42.0.0.255"  # Meter device ID (e.g. LGZ1020782546371)
    name: "Meter Device ID"
    icon: mdi:identifier

  - platform: dlms_meter
    obis_code: "0-0:96.1.1.255"  # Meter serial number (7-digit index)
    name: "Meter Serial Number"
    icon: mdi:counter

  - platform: dlms_meter
    obis_code: "0-0:96.14.0.255" # Active tariff profile (e.g. RATE1, RATE2)
    name: "Active Tariff"
    icon: mdi:cash-clock


# ============================================================
# BINARY SENSORS
# ============================================================
binary_sensor:
  - platform: template
    name: "Meter Breaker"
    device_class: connectivity
    # EAC can remotely disconnect your supply via this breaker.
    # ON = connected (normal), OFF = disconnected by utility
    lambda: return id(raw_breaker_status).state == 1;
